services:
  # ── Backend ──────────────────────────────────────────────────────────────────
  - type: web
    name: leepr-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: WATSONX_API_KEY
        sync: false
      - key: WATSONX_PROJECT_ID
        sync: false
      - key: WATSONX_MODEL
        value: ibm/granite-3-3-8b-instruct
      - key: EIA_API_KEY
        sync: false
      # Leave blank on first deploy: the server allows all origins when this is
      # unset. After the frontend is live, paste its URL here to lock CORS down.
      - key: CORS_ORIGIN
        sync: false

  # ── Frontend (static site) ───────────────────────────────────────────────────
  - type: web
    name: leepr-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # This value is compiled into browser JavaScript, so it must be the public
      # origin. Render's fromService "host" property is the private hostname
      # "leepr-backend", which browsers outside Render cannot resolve.
      - key: VITE_API_URL
        value: https://leepr-backend.onrender.com
