services:
  # ── Backend ──────────────────────────────────────────────────────────────────
  - type: web
    name: bob-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: WATSONX_API_KEY
        sync: false
      - key: WATSONX_PROJECT_ID
        sync: false
      - key: EIA_API_KEY
        sync: false
      # Leave blank on first deploy: the server allows all origins when this is
      # unset. After the frontend is live, paste its URL here to lock CORS down.
      - key: CORS_ORIGIN
        sync: false

  # ── Frontend (static site) ───────────────────────────────────────────────────
  - type: web
    name: bob-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set this to the backend URL once the backend service is live, e.g.
      # https://bob-backend-xxxx.onrender.com
      # Vite inlines it at build time, so changing it triggers a rebuild.
      - key: VITE_API_URL
        sync: false
